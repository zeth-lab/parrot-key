<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>앵무새 도감 · 실험 2</title>
<meta name="description" content="깃털을 골라 앵무새를 찾는 도감 (실험 2)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: 검은 허공에 세 영역 — 부위 그림, 질문, 깃털(선택지).
   웹 A: 그림 왼쪽 · 질문 오른쪽 위 · 깃털이 오른쪽 아래 사선으로. 웹 B: 질문 왼쪽 · 깃털이 오른쪽 가장자리에서 부채처럼.
   폰: 그림 위 · 질문 가운데 · 깃털이 바닥에서 솟아오름. 색은 깃털과 사진에서만 나온다. */
:root{
  --bg:#000; --ink:#f1efe9; --dim:#8c8a84; --faint:#3a3936; --soft:rgba(241,239,233,.07); --soft2:rgba(241,239,233,.14);
  --hl:#ffcf4a;
  --f:"Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --g:clamp(16px,4vw,56px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0; height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--f); font-weight:700; font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; word-break:keep-all; overflow-wrap:break-word; overflow-x:hidden}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}
:focus-visible{outline:2px solid var(--hl); outline-offset:3px; border-radius:6px}
.sci{font-style:italic; font-weight:400}
.dim{color:var(--dim); font-weight:500}

.top{position:fixed; top:0; left:0; right:0; z-index:40; display:flex; justify-content:space-between; align-items:center; gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 18px) var(--g) 0; pointer-events:none}
.top > *{pointer-events:auto}
.brand{font-weight:900; font-size:16px; letter-spacing:-.02em}
.pill{padding:7px 14px; border-radius:999px; background:var(--soft); font-size:13px}
.pill:hover{background:var(--soft2)}
body.on-cover .brand{visibility:hidden}
@media (max-width:760px){ .layout-pill{display:none} }

.screen{position:relative; min-height:100svh; padding:calc(env(safe-area-inset-top,0px) + 70px) var(--g) 32px; overflow:hidden}

/* ── 표지 ── */
/* 웹: 왼쪽 2/3 제목·버튼, 오른쪽 1/3 앵무새. 폰: 제목 위 · 앵무새 가운데 · 버튼 아래 */
.cover{display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); align-items:center; padding-left:clamp(24px,7vw,120px)}
.cover .inner{position:relative; z-index:2; display:grid; justify-items:start; gap:clamp(18px,2.6svh,30px); margin-top:-4svh}
.cover .ttl{display:grid; gap:clamp(12px,1.8svh,20px)}
.cover h1{margin:0; font-weight:900; font-size:clamp(60px,10.6vw,184px); line-height:.84; letter-spacing:-.055em}
.cover h1 .the{font-size:.36em; font-weight:500; letter-spacing:-.01em; margin-left:.32em; color:var(--dim)}
.cover p{margin:0; color:var(--dim); font-weight:500; font-size:clamp(14px,1.15vw,17px)}
.cover .acts{display:grid; justify-items:start; gap:14px}
.go{display:inline-flex; align-items:center; gap:14px; padding:20px 34px; border-radius:999px; background:var(--ink); color:#000; font-weight:900; font-size:clamp(18px,1.6vw,22px); transition:background .2s, gap .25s}
.go:hover{background:var(--hl); gap:20px}
.go .ar{font-weight:500}
.tolink{color:var(--dim); font-weight:700; font-size:14px; border-bottom:1px solid var(--faint); padding:3px 0}
.tolink:hover{color:var(--ink); border-color:var(--ink)}
.birdfx{position:fixed; z-index:5; pointer-events:none; transform-origin:0 0}
.birdfx svg{width:100%; height:100%; overflow:visible}
.birdfx .lid, .birdfx .happy{display:none}
.birdfx svg.bird .lid{display:block}

/* ── 찾았어! : 새가 가운데로 와서 흔들리다 사진으로 펑 ── */
.foundfx{position:fixed; inset:0; z-index:45; pointer-events:auto}
.foundfx .birdfx{position:absolute; transition:transform .75s cubic-bezier(.45,.05,.25,1)}
.foundfx .birdfx svg{transition:transform .18s ease-in, opacity .18s ease-in}
.foundfx .birdfx.jit1 svg{animation:jit1 .1s linear infinite}
.foundfx .birdfx.jit2 svg{animation:jit2 .055s linear infinite}
.foundfx .birdfx.gone svg{transform:scale(1.18); opacity:0; animation:none}
@keyframes jit1{0%,100%{transform:translate(0,0) rotate(0)} 25%{transform:translate(-5px,1px) rotate(-1.5deg)} 75%{transform:translate(5px,-1px) rotate(1.5deg)}}
@keyframes jit2{0%,100%{transform:translate(0,0) rotate(0) scale(1.02)} 25%{transform:translate(-10px,3px) rotate(-3.5deg) scale(1.04)} 50%{transform:translate(4px,-6px) rotate(2deg) scale(1.03)} 75%{transform:translate(10px,2px) rotate(3.5deg) scale(1.05)}}
.flash{position:absolute; width:40px; height:40px; margin:-20px 0 0 -20px; border-radius:50%; background:radial-gradient(circle,#fff 0,rgba(255,255,255,.85) 30%,rgba(255,255,255,0) 70%);
  animation:flash .6s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes flash{0%{transform:scale(.2); opacity:1} 100%{transform:scale(28); opacity:0}}
.puff{position:absolute; width:clamp(70px,9vw,130px); height:clamp(14px,1.8vw,26px); margin-top:calc(clamp(14px,1.8vw,26px) / -2); transform-origin:0 50%;
  animation:puff .95s cubic-bezier(.15,.75,.3,1) forwards}
.puff svg{width:100%; height:100%; display:block}
@keyframes puff{0%{transform:rotate(var(--a)) translateX(0) scale(.3); opacity:1} 70%{opacity:1} 100%{transform:rotate(calc(var(--a) + var(--s))) translateX(var(--d)) scale(1); opacity:0}}
.popph{position:absolute; margin:0; border-radius:10px; overflow:hidden; background:#111; box-shadow:0 30px 80px rgba(0,0,0,.6);
  animation:popin .6s cubic-bezier(.2,1.55,.4,1) both}
.popph img{width:100%; height:100%; object-fit:cover; object-position:center 35%; display:block}
.popph .art{position:absolute; inset:6%} .popph .art svg{width:100%; height:100%}
.popph.move{animation:none; transition:left .85s cubic-bezier(.6,0,.2,1), top .85s cubic-bezier(.6,0,.2,1), width .85s cubic-bezier(.6,0,.2,1), height .85s cubic-bezier(.6,0,.2,1), border-radius .85s, box-shadow .85s}
@keyframes popin{0%{transform:scale(.35); opacity:0} 60%{opacity:1} 100%{transform:scale(1); opacity:1}}
.foundtxt{position:absolute; left:0; right:0; margin:0; text-align:center; font-weight:900; font-size:clamp(44px,7vw,104px); letter-spacing:-.04em; line-height:1;
  text-shadow:0 4px 30px rgba(0,0,0,.8); animation:foundtxt .55s .12s cubic-bezier(.2,1.6,.4,1) both; transition:opacity .35s, transform .45s}
.foundtxt.out{opacity:0; transform:translateY(-18px)}
@keyframes foundtxt{0%{transform:translateY(24px) scale(.7); opacity:0} 100%{transform:none; opacity:1}}
.q .zone-q, .q .zone-opts{transition:opacity .35s ease}
.q.finding .zone-q, .q.finding .zone-opts{opacity:0; pointer-events:none}
.choices{display:flex; gap:12px; flex-wrap:wrap; justify-content:center}
.big{min-width:180px; padding:18px 28px; border-radius:999px; background:var(--soft); font-weight:900; font-size:clamp(17px,2vw,20px); transition:background .2s}
.big:hover{background:var(--soft2)}
.big.solid{background:var(--ink); color:#000}
.big.solid:hover{background:var(--hl)}
.big small{display:block; font-weight:500; font-size:12px; opacity:.7; margin-top:2px}
.cover .fan{position:absolute; left:0; top:0; bottom:0; width:50vw; z-index:1; opacity:.9}
@media (max-width:760px){ .cover .fan{width:auto; right:0; top:auto; height:40svh} }


/* 표지 앵무새 */
.perch{position:absolute; right:clamp(-48px,-2vw,0px); bottom:-9svh; height:min(108svh,64vw); aspect-ratio:700/1244; z-index:1; pointer-events:none; transform-origin:55% 70%}
.perch svg{width:100%; height:100%; overflow:visible}
.perch .pb{transition:transform .9s cubic-bezier(.3,1.35,.5,1), opacity .3s; transform-box:view-box; transform-origin:350px 760px}
.perch .pb.away{transform:translateY(-130vh); opacity:0; transition:none}
.perch .pb.fly{transform:translate(55vw,-110vh) rotate(-24deg); transition:transform 1.3s cubic-bezier(.5,0,.8,.4), opacity 1.3s}
.perch .pb.flip{transform:scaleX(-1)}
.perch .pb.shake{animation:shake .14s 7 linear}
.perch .pb.hop{animation:hop2 .4s ease}
@keyframes shake{0%,100%{transform:translateX(0) rotate(0)} 25%{transform:translateX(-6px) rotate(-1.4deg)} 75%{transform:translateX(6px) rotate(1.4deg)}}
@keyframes hop2{0%,100%{transform:translateY(0)} 45%{transform:translateY(-34px)}}
.perch .hitbird{pointer-events:visiblePainted; cursor:pointer}
.perch .lid{transform:scaleY(0); transform-box:view-box; transform-origin:241px 84px; animation:lid 5s infinite}
.perch .happy{opacity:0; transition:opacity .15s}
.perch.tickle .happy{opacity:1}
.perch.tickle .lid{animation:none; transform:scaleY(1)}
.peek{position:fixed; z-index:3; width:clamp(150px,18vw,260px); aspect-ratio:380/330; pointer-events:none;
  transition:transform .6s cubic-bezier(.3,1.3,.5,1)}
.peek svg{width:100%; height:100%; overflow:visible}
@media (max-width:760px){
  .cover{grid-template-columns:minmax(0,1fr); padding-left:var(--g); align-items:stretch}
  .cover .inner{margin-top:0; min-height:calc(100svh - 110px); justify-items:center; align-content:space-between; text-align:center}
  .cover h1{font-size:clamp(52px,17vw,92px)}
  .cover .acts{justify-items:center; padding-bottom:8px}
  .perch{right:auto; left:50%; bottom:auto; top:31svh; height:47svh; margin-left:calc(47svh * -700 / 1244 / 2)}
}

/* ── 질문 화면: 세 영역 ── */
.q{display:grid; min-height:calc(100svh - 102px)}
.zone-fig{position:relative}
.zone-fig svg{width:100%; height:100%; display:block}
.zone-q h1{margin:0; font-weight:900; font-size:clamp(24px,2.8vw,38px); line-height:1.22; letter-spacing:-.025em}
.zone-q p{margin:8px 0 0; color:var(--dim); font-weight:500; font-size:14px; max-width:44ch}
.zone-q .step{font-size:12px; color:var(--dim); letter-spacing:.04em}
.zone-q .row{display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:16px}
.link{color:var(--dim); border-bottom:1px solid var(--faint); padding:4px 0}
.link:hover{color:var(--ink); border-color:var(--ink)}
.link:disabled{opacity:.3; cursor:default}
.trail{list-style:none; margin:14px 0 0; padding:0; display:flex; flex-wrap:wrap; gap:6px}
.trail button{display:flex; align-items:center; gap:6px; padding:3px 10px 3px 5px; border-radius:999px; background:var(--soft); font-size:12px; color:var(--dim)}
.trail button:hover{color:var(--ink); text-decoration:line-through}
.trail i{width:12px; height:12px; border-radius:50%}
.zone-opts{position:relative}

/* 웹: 왼쪽에서 깃털 부채가 들어오며 펼쳐지고, 오른쪽에 질문과 부위 그림 */
/* 웹: 아키네이터처럼 캐릭터는 오른쪽 1/3(표지와 같은 자리), 왼쪽 위 질문, 왼쪽 아래 깃털 부채(축은 오른쪽 아래, 새의 발치) */
.q{height:calc(100svh - 102px); grid-template-columns:minmax(0,2fr) minmax(0,1fr); grid-template-rows:auto minmax(0,1fr); grid-template-areas:"q fig" "opts fig"; column-gap:clamp(16px,3vw,48px)}
.zone-opts{grid-area:opts; min-height:0; overflow:visible; touch-action:none; outline:none; position:relative; z-index:2}
.zone-opts::-webkit-scrollbar{display:none}
.fanwrap{position:relative; width:100%}
.zone-q{grid-area:q; padding-top:4svh; padding-left:clamp(0px,4vw,64px); position:relative; z-index:3}
.zone-fig{grid-area:fig; height:calc(100% + 32px); min-height:0; margin:0 calc(var(--g) * -1) -32px 0}
.zone-q h1{max-width:18em}
@media (min-width:761px){ .zone-q h1{font-size:clamp(28px,3.3vw,52px); line-height:1.18} }
@media (max-width:760px){
  .q{height:auto; grid-template-columns:minmax(0,1fr); grid-template-rows:auto auto minmax(0,1fr); grid-template-areas:"fig" "q" "opts"; min-height:calc(100svh - 92px)}
  .zone-fig{height:24svh; min-height:0; margin:0}
  .zone-q{padding-top:0; padding-left:0; text-align:center}
  .zone-q h1{margin-inline:auto}
  .zone-q p{margin-inline:auto}
  .zone-q .row, .trail{justify-content:center}
  .zone-opts{height:46svh; margin:0 calc(var(--g) * -1) -32px}
}

/* 깃털: 한 다발로 모여 왼쪽 밖에 있다가(.out) 들어오며 방사형으로 펼쳐짐(.open) */
.plume{position:absolute; transform-origin:0 50%; pointer-events:none; transition-property:transform,opacity;
  transform:translate(var(--ox,0), var(--oy,0)) rotate(var(--c)); opacity:0;
  transition:transform .95s cubic-bezier(.22,.8,.18,1), opacity .5s ease; filter:drop-shadow(0 6px 16px rgba(0,0,0,.7))}
.plume.open{transform:translate(0,0) rotate(var(--r)); opacity:1}
.plume.open.hov{transform:translate(0,0) rotate(var(--r)) scale(1.04); filter:drop-shadow(0 8px 22px rgba(0,0,0,.7)) brightness(1.18); z-index:30}
.plume svg{width:100%; height:100%; display:block; overflow:visible}
.plume .hit{pointer-events:visiblePainted; cursor:pointer}
.plume .lab{position:absolute; left:calc(100% + 6px); top:50%; white-space:nowrap; font-size:15px; font-weight:900; text-shadow:0 1px 8px #000;
  transform-origin:0 50%; transform:translate(8px,-50%) rotate(calc(var(--r) * -1)); opacity:0; transition:opacity .3s; pointer-events:auto; cursor:pointer}
.plume.open .lab{opacity:.55; transition-delay:.6s}
.plume.focus .lab, .plume.hov .lab{opacity:1; color:var(--hl)}
.plume.focus{z-index:20; filter:drop-shadow(0 6px 16px rgba(0,0,0,.7)) brightness(1.15)}
.plume.open{transition-duration:.95s, .5s}
.plume.open.ready{transition-duration:.12s, .3s}
.plume.short{z-index:2}
.plume.hov .lab{color:var(--hl)}

/* 그림 선택지 */
.cards{position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; gap:14px}
.card{display:grid; grid-template-columns:170px minmax(0,1fr); gap:16px; align-items:center; text-align:left; opacity:0; transform:translateX(-40px);
  transition:opacity .5s ease, transform .6s cubic-bezier(.2,.8,.2,1)}
.card.in{opacity:1; transform:none}
.card svg{width:170px; height:170px; display:block}
.card b{font-size:20px; font-weight:900; display:block}
.card span{color:var(--dim); font-weight:500; font-size:13px}
.card:hover b{color:var(--hl)}
@media (max-width:760px){
  .cards{position:relative; flex-direction:row; overflow-x:auto; justify-content:flex-start; padding:12px var(--g) 28px; gap:12px; scroll-snap-type:x mandatory}
  .card{grid-template-columns:1fr; justify-items:center; text-align:center; min-width:42%; scroll-snap-align:center; transform:translateY(30px)}
  .card svg{width:110px; height:110px}
}

/* ── 정답 확인 ── */
.result{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); gap:clamp(24px,4vw,64px); align-items:center}
.result .photo{position:relative; height:calc(100svh - 110px); border-radius:4px; overflow:hidden; background:#111; opacity:0; transform:translateX(40px); transition:opacity 1s, transform 1s}
.result .photo.in{opacity:1; transform:none}
.result .photo img{width:100%; height:100%; object-fit:cover; object-position:center 35%}
.result .photo .art{position:absolute; inset:8%}
.result .photo .art svg{width:100%; height:100%}
.result .photo figcaption{position:absolute; left:12px; right:12px; bottom:10px; font-size:11px; color:rgba(255,255,255,.7); font-weight:500; text-shadow:0 1px 6px #000}
.panel{display:grid; gap:14px}
.panel .ask{margin:0; color:var(--dim)}
.panel .intro{margin:0; max-width:34em; font-size:clamp(15px,1.25vw,18px); font-weight:500; line-height:1.65; color:var(--ink); opacity:.9}
.panel h1{margin:0; font-weight:900; font-size:clamp(44px,6.5vw,96px); line-height:1; letter-spacing:-.04em}
.aka{margin:0; color:var(--dim); font-weight:500; line-height:1.6}
.badge{display:inline-block; padding:2px 10px; border-radius:999px; background:var(--soft2); font-size:12px; margin-right:6px; color:var(--ink)}
.badge.red{background:#c9402b}
.btns{display:grid; gap:10px; margin-top:8px; max-width:440px}
.btns .big{text-align:left}
.rise{animation:rise .7s .25s ease both}
@keyframes rise{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
@media (max-width:760px){
  .result{grid-template-columns:minmax(0,1fr)}
  .result .photo{height:44svh; order:-1; transform:translateY(20px)}
  .panel h1{font-size:46px}
}

/* 후보 */
.cgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:18px; margin-top:18px}
.cc{text-align:left; display:grid; gap:6px}
.cc .ph{aspect-ratio:4/5; border-radius:4px; overflow:hidden; background:#111; display:grid; place-items:center}
.cc .ph img{width:100%; height:100%; object-fit:cover}
.cc .ph svg{height:86%}
.cc b{font-size:16px; font-weight:900}
.cc span{font-size:12px; color:var(--dim); font-weight:500}
.cc:hover b{color:var(--hl)}
.cc .ph{position:relative}
/* 북마크: 이름 아래 별, 도감 카드 오른쪽 위 빨간 리본 */
.star{justify-self:start; display:inline-flex; align-items:center; gap:8px; padding:8px 15px 8px 11px; border-radius:999px; background:var(--soft); font-size:14px; color:var(--dim); transition:background .2s, color .2s}
.star svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linejoin:round; transition:fill .2s}
.star:hover{background:var(--soft2); color:var(--ink)}
.star.on{color:#ff5a4a; background:rgba(255,90,74,.13)}
.star.on svg{fill:#ff5a4a}
.star.pop svg{animation:starpop .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes starpop{0%{transform:scale(.4) rotate(-30deg)} 100%{transform:none}}
.cc .ph .ribbon, .ribbon{position:absolute; top:-3px; right:12px; width:22px; height:34px; z-index:2; filter:drop-shadow(0 3px 5px rgba(0,0,0,.55))}
.ribbon path{fill:#e2392c}
.bmcount{margin:10px 0 0; color:var(--dim); font-weight:500; font-size:13px}

/* 도감 */
.search{width:100%; max-width:520px; padding:12px 0; border:0; border-bottom:2px solid var(--soft2); background:none; font:inherit; font-size:20px; font-weight:900; color:var(--ink)}
.search:focus{outline:none; border-color:var(--ink)}
.search::placeholder{color:var(--faint)}
.bhead{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:end; gap:16px}
.bhead h1{margin:0; font-weight:900; font-size:clamp(34px,5vw,64px); letter-spacing:-.03em}

/* 종 페이지 */
.kv{display:grid; grid-template-columns:max-content minmax(0,1fr); gap:6px 16px; margin:0; font-size:14px}
.kv dt{color:var(--dim); font-weight:500}
.kv dd{margin:0; display:flex; flex-wrap:wrap; gap:4px 10px; align-items:center}
.kv i{width:12px; height:12px; border-radius:50%; display:inline-block; margin-right:4px; vertical-align:-1px}
.sec{display:grid; gap:10px; padding-top:16px; border-top:1px solid var(--soft2)}
.sec h2{margin:0; font-size:13px; color:var(--dim)}
.detail .panel{max-height:calc(100svh - 110px); overflow:auto; padding-right:8px}
@media (max-width:760px){ .detail .panel{max-height:none} }

svg.bird .ol{fill:none; stroke:var(--ink); stroke-width:1.3; stroke-linejoin:round; stroke-linecap:round}
svg.bird .rg{transition:fill .35s, fill-opacity .35s}
svg.bird.raster .rg[data-part]{filter:url(#wc)}
svg.bird .body, svg.bird .head, svg.bird .eye{transform-box:fill-box}
svg.bird.live .body{transform-origin:50% 100%; animation:breathe 4.2s ease-in-out infinite}
svg.bird.live .eye{transform-origin:50% 50%; animation:blink 5.5s infinite}

/* ───────── 주 그림: 제공된 앵무새 선화(bird/line.png)를 부위별 마스크로 칠한다 ───────── */

      pb.classList.add("hop"); if (!await sleep(400)) { cleanup(); return; }
      pb.classList.remove("hop", "on"); pb.classList.add("fly");
      if (!await sleep(2600)) { cleanup(); return; }
      break;
    }
  }
  cleanup();
}

function birdBox(svg){ // 그림 좌표 (0,0)이 화면 어디에, 몇 배로 그려지는지
  const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
  const s = Math.min(r.width / vb.width, r.height / vb.height);
  return { x:r.left + (r.width - vb.width * s) / 2 - vb.x * s, y:r.top + (r.height - vb.height * s) / 2 - vb.y * s, s };
}

/* ───────── 찾기 ───────── */
// 지금 남은 후보에게 해당할 법한 답만 고른다 (깃털 수가 질문마다 달라진다)
function plausibleOptions(q){
  if (!isColorQ(q)) return q.options;
  const lw = eng.posterior(S.answers, S.rejected), looks = eng.looks;
  const P = q.options.map(o => 0);
  looks.forEach((l, i) => { if (lw[i] < 1e-6) return; const L = q.options.map(o => likelihood(q, l, o.v)); const Z = L.reduce((a, b) => a + b, 0); L.forEach((x, k) => P[k] += lw[i] * x / Z); });
  let keep = q.options.filter((o, k) => P[k] >= .025);
  if (keep.length < 3) keep = q.options.map((o, k) => ({ o, p:P[k] })).sort((a, b) => b.p - a.p).slice(0, 3).map(x => x.o);
  return q.options.filter(o => keep.includes(o));
}

let leaving = null;
// 지금까지 답한 것으로 그림에 색을 하나씩 입힌다 (질문마다 드로잉이 완성되어 감)
function answersToAttrs(answers){
  const A = {};
  answers.forEach(({ qid, ans }) => {
    if (ans === "skip") return;
    const q = QMAP[qid];
    if (qid === "crest") { A.crest = ans === "yes"; return; }
    if (qid === "crestColor") { if (ans !== "none") A.crestColor = [ans]; return; }
    if (qid === "eyeSkin") { A.eyeSkin = ans; return; }
    if (qid === "pattern") { A.pattern = ans; return; }
    if (q.kind === "color" || q.kind === "colorOrNone") { if (ans !== "none") A[qid] = [ans]; }
  });
  return A;
}
function renderFind(){
  const R = eng.ranking(S.answers, S.rejected), top = R.list[0];
  const next = eng.nextQuestion(S.answers, S.rejected), asked = S.answers.length;

    const figSvg = $v.querySelector(".q #fig svg");
    if (figSvg && !matchMedia("(prefers-reduced-motion: reduce)").matches) foundSequence(top, asked, figSvg); else renderResult(top, asked);
    return;
  }
  const q = next.q, opts = plausibleOptions(q), color = isColorQ(q);
  const focusPart = q.part.includes("all") ? "all" : q.part[0];
  const soFar = answersToAttrs(S.answers);
  $v.innerHTML = `<section class="screen"><div class="q">
    <div class="zone-fig" id="fig" data-focus="${esc(focusPart)}">${birdSVG(soFar, { label:q.q, anim:true, paintedFocus:focusPart })}</div>
    <div class="zone-q">

      <h1>“${q.q}”</h1>${q.hint ? `<p>${q.hint}</p>` : ""}
      <div class="row row-main"><button class="link idk" id="skip">잘 모르겠어요</button></div>
      <div class="row row-sub">
        <button class="link sub" id="undo" ${asked ? "" : "disabled"}>되돌리기</button>
        <button class="link sub" id="reset" ${asked ? "" : "disabled"}>처음부터</button>
      </div>
      ${trail()}
    </div>
    <div class="zone-opts" id="opts"></div>
  </div></section>`;
  const svg = document.querySelector("#fig svg");
  svg.querySelectorAll(`[data-part="${focusPart}"]`).forEach(el => el.classList.add("focus-pulse"));
  requestAnimationFrame(() => zoomTo(svg, focusPart));
  // 머리 쪽 부위를 물을 때는 고개를 살짝 갸웃
  if (["crown","forehead","face","cheek","beak","eyeskin","crest","throat"].includes(focusPart)) setTimeout(() => svg.classList.add("tilt"), 500);
  const box = document.getElementById("opts");
  let fanEls = [];
  const choose = async v => {
    if (leaving) return; leaving = true;
    svg.classList.remove("tilt"); svg.classList.add("hop");   // 고르는 순간 콩 하고 뛰어오름

    box.querySelectorAll(".card").forEach(el => { el.style.transitionDelay = "0ms"; el.classList.remove("in"); });
    zoomTo(svg, "all", 650);
    await wait(700);
    leaving = null;
    S.answers.push({ qid:q.id, ans:v }); render();
  };
  if (color) {
    const items = opts.map(o => ({ v:o.v, label:o.label, color:hex(o.v), ghost:o.v === "none" }));
    const parts = q.part.filter(x => x !== "all");
    fanEls = buildFan(box, items, it => choose(it.v), it => previewPart(svg, parts.length ? parts : ["belly"], it ? (it.ghost ? "transparent" : it.color) : "var(--hl)"));
    fanIn(fanEls);
  } else {
    box.innerHTML = `<div class="cards">${opts.map(o => `<button class="card" data-v="${o.v}">${optionArt(q, o)}<div><b>${esc(o.label)}</b>${o.sub ? `<span>${esc(o.sub)}</span>` : ""}</div></button>`).join("")}</div>`;
    box.querySelectorAll(".card").forEach((el, i) => { el.style.transitionDelay = (150 + i * 90) + "ms"; el.onclick = () => choose(el.dataset.v); requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("in"))); });
  }

  document.getElementById("undo").onclick = () => { S.answers.pop(); render(); };

  $v.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { S.answers.splice(+b.dataset.rm, 1); S.declined.clear(); S.rejected.clear(); render(); });

// 색이 아닌 질문의 그림 선택지: 같은 그림체로, 해당 부위를 확대해서
function optionArt(q, o){
  const base = { wing:["g"], breast:["g"], back:["g"], belly:["g"], face:["g"], crown:["g"], forehead:["g"], throat:["g"], tail:["g"], beak:["gr"] };
  let variant = {}, part = q.part[0];
  if (q.id === "tailShape") { variant.tailShape = o.v; part = "all"; }
  if (q.id === "crest") { variant.crest = o.v === "yes"; part = "crest"; }
  if (q.id === "eyeSkin") { variant.eyeSkin = o.v; part = "eyeskin"; }
  if (q.id === "pattern") { variant.pattern = o.v; part = "wing"; }
  if (q.id === "size") {
    const sc = { s:.42, m:.6, l:.8, xl:1 }[o.v];
    return `<svg viewBox="0 0 120 120"><g transform="translate(${60 - 46 * sc} ${118 - 112 * sc}) scale(${sc * .64})">${birdVec(null, { neutral:true, focus:[] }).replace(/^<svg[^>]*>/, "").replace(/<\/svg>$/, "")}</g><line x1="4" y1="118" x2="116" y2="118" stroke="var(--dim)"/></svg>`;
  }
  const f = FOCUS[part === "all" ? "all" : part] || FOCUS.all, pad = part === "all" ? 0 : .5;
  const vb = [f[0] - f[2] * pad, f[1] - f[3] * pad, f[2] * (1 + 2 * pad), f[3] * (1 + 2 * pad)];
  const s = Math.max(vb[2], vb[3]); vb[0] -= (s - vb[2]) / 2; vb[1] -= (s - vb[3]) / 2; vb[2] = vb[3] = s;
  if (q.id === "eyeSkin") variant.eyeSkinColor = "w";
  return birdVec(Object.assign({}, base, variant), { vb, label:o.label });
}
function trail(){
  if (!S.answers.length) return "";
  return `<ul class="trail">${S.answers.map((a, i) => { const q = QMAP[a.qid];
    return `<li><button data-rm="${i}" title="이 답 지우기">${COLORS[a.ans] ? `<i style="background:${hex(a.ans)}"></i>` : ""}${SHORT[a.qid]} ${answerLabel(q, a.ans)} ×</button></li>`; }).join("")}</ul>`;
}
function resetFind(){ S.answers = []; S.rejected = new Set(); S.declined = new Set(); nav("find"); }

    .forEach(([k, n]) => { if (!Array.isArray(A[k]) || A[k][0] === main || !CADJ[A[k][0]]) return;

  byC.slice(0, 2).forEach(({ c, p }) => { const ps = p.slice(0, 3); items.push(`${CADJ[c]} ${ps.length === 2 ? ps[0] + josa(ps[0], "과", "와") + " " + ps[1] : ps.join("·")}`); });
  if (Array.isArray(A.cheek) && CADJ[A.cheek[0]]) items.push(`뺨의 ${CADJ[A.cheek[0]].replace(/색$/, "")} 점`);
  if (Array.isArray(A.collar) && CADJ[A.collar[0]]) items.push(`목의 ${CADJ[A.collar[0]].replace(/색$/, "")} 띠`);
  if (A.crest) items.push("머리 위 볏");
  if (A.eyeSkin === "face") items.push("얼굴의 넓은 맨살"); else if (A.eyeSkin === "ring") items.push("눈 둘레의 맨살 고리");
  if (A.pattern === "barred") items.push("가로 줄무늬"); else if (A.pattern === "scaled") items.push("비늘 같은 무늬");
  const top = items.slice(0, 3);
  let s2 = "";
  if (main && CADJ[main]) {
    const body = `${CADJ[main]} 몸`;
    if (top.length) { const last = top[top.length - 1]; s2 = ` ${body}에 ${top.join(", ")}${josa(last, "이", "가")} ${ex ? "눈에 띄었어요" : "눈에 띄어요"}.`; }
    else s2 = ` 온몸이 거의 ${COLORS[main].ko}${be(COLORS[main].ko)}.`;
  }
  const s3 = sp.extinct ? " 지금은 멸종해서 볼 수 없어요." : "";
  return s1 + s2 + s3;
}

async function foundSequence(top, asked, figSvg){
  if (finding) return; finding = true;
  const sp = top.species, A = Object.assign({}, sp.base, top.look || {}), u = photo(sp, "large");
  // 사진은 미리 불러 둔다 (흔드는 동안)

  figSvg.style.visibility = "hidden";

  const cx = W / 2, cy = H / 2;   // 그림 가운데(새 몸통 쯤)를 화면 가운데로
  const bx = b.x + 350 * b.s, by = b.y + 600 * b.s;
  fx.style.transformOrigin = `${350 * b.s}px ${600 * b.s}px`;
  void fx.offsetWidth;
  fx.style.transform = `translate(${cx - bx}px,${cy - by}px) scale(${k})`;
  await wait(800);
  // 2) 점점 세게 흔들림

  fx.classList.remove("jit1"); fx.classList.add("jit2"); await Promise.all([wait(600), ready]);
  // 3) 펑!
  fx.classList.remove("jit2"); fx.classList.add("gone");
  const fl = document.createElement("div"); fl.className = "flash"; Object.assign(fl.style, { left:cx + "px", top:cy + "px" }); layer.appendChild(fl);
  const cols = [...new Set(["main","crown","face","breast","wing","tail","forehead","cheek"].flatMap(key => Array.isArray(A[key]) ? A[key] : []))].map(hex).filter(Boolean);
  for (let i = 0; i < 14; i++) {
    const pf = document.createElement("div"); pf.className = "puff";

    pf.style.setProperty("--s", ((Math.random() - .5) * 50) + "deg");
    pf.style.setProperty("--d", (Math.min(W, H) * (.3 + Math.random() * .22)) + "px");

  }
  const m = mobile(), ph = document.createElement("figure"); ph.className = "popph";
  const pw = m ? W * .78 : Math.min(H * .62 * .8, W * .5), phh = pw * 1.25;
  Object.assign(ph.style, { left:(cx - pw / 2) + "px", top:(cy - phh / 2 + (m ? 30 : 36)) + "px", width:pw + "px", height:phh + "px" });
  ph.innerHTML = u ? `<img src="${esc(u)}" alt="">` : `<div class="art">${birdSVG(A)}</div>`;
  layer.appendChild(ph);
  const tx = document.createElement("p"); tx.className = "foundtxt"; tx.textContent = "찾았어!";
  tx.style.top = Math.max(20, cy - phh / 2 + (m ? 30 : 36) - (m ? 70 : Math.min(118, W * .08))) + "px"; layer.appendChild(tx);

const lookAttrs = (s, li) => Object.assign({}, s.base, s.looks[li]);
function similar(si){
  const qs = QUESTIONS.filter(q => q.id !== "size"), me = eng.looks.filter(l => l.si === si);
  return SP.map((s, j) => { if (j === si) return null; let best = null;
    for (const a of me) for (const b of eng.looks.filter(l => l.si === j)) { let sc = 0; const diffs = [];
      for (const q of qs) { const va = valueOf(a, q.id), vb = valueOf(b, q.id); if (va == null || vb == null) continue;
        const ka = Array.isArray(va) ? va[0] : va, kb = Array.isArray(vb) ? vb[0] : vb; if (ka === kb) sc++; else diffs.push({ q, va, vb }); }
      if (!best || sc > best.sc) best = { sc, diffs }; }
    return { j, ...best }; }).filter(Boolean).sort((x, y) => y.sc - x.sc).slice(0, 3);
}

    diet:"씨앗, 열매, 꽃, 곡식.", smart:"사람 말을 잘 따라 하는 종이 많아요. 일부는 원래 살던 곳을 벗어나 세계 여러 도시에 퍼져 살아요." },
  { g:"Eclectus", n:"뉴기니아앵무",
    diet:"열매, 꽃, 씨앗, 새싹.", smart:"수컷은 초록, 암컷은 빨강과 파랑으로 암수 색이 완전히 달라서 한때 다른 종으로 여겨졌어요." },
  { g:"Platycercus Barnardius Northiella Psephotus Psephotellus Neophema Neopsephotus Purpureicephalus Polytelis Alisterus Aprosmictus Cyanoramphus Eunymphicus Prosopeia Psittacella", n:"오세아니아 앵무",
    diet:"풀씨와 씨앗, 열매, 새싹. 땅에서 먹이를 찾는 경우가 많아요.", smart:"휘파람과 노래 같은 소리를 잘 내요. 짝이나 작은 무리로 지내요." },
  { g:"Melopsittacus", n:"사랑앵무",
    diet:"땅에 떨어진 풀씨.", smart:"아주 많은 단어를 따라 한 기록이 있을 만큼 흉내를 잘 내요. 야생에서는 수백·수천 마리가 무리 지어 물을 찾아 옮겨 다녀요." },
  { g:"Lathamus", n:"스위프트앵무",
    diet:"유칼립투스 꽃꿀과 꽃가루, 작은 곤충.", smart:"해마다 바다를 건너 섬과 대륙 사이를 오가는, 철새 같은 앵무예요." },
  { g:"Pezoporus", n:"땅앵무",
    diet:"풀씨와 풀.", smart:"거의 날지 않고 풀숲 땅에서 살아요. 밤앵무는 밤에 활동해 보기 매우 어려워요." },
  { g:"Agapornis", n:"모란앵무(러브버드)",
    diet:"씨앗, 열매, 풀, 새싹.", smart:"짝과 붙어 지내 '사랑새'로 불려요. 나뭇잎을 꽁지 깃털에 꽂아 둥지 재료를 나르는 종도 있어요." },
  { g:"Loriculus", n:"걸이앵무",
    diet:"꽃꿀, 꽃, 부드러운 열매.", smart:"박쥐처럼 나뭇가지에 거꾸로 매달려 잠을 자요." },
  { g:"Micropsitta", n:"피그미앵무",
    diet:"나무껍질의 이끼와 균류(곰팡이), 작은 곤충.", smart:"세계에서 가장 작은 앵무새 무리예요. 딱따구리처럼 꼬리로 몸을 받치고 나무줄기를 타요." },
  { g:"Cyclopsitta Bolbopsittacus", n:"무화과앵무",
    diet:"무화과 같은 열매 속 씨앗.", smart:"작고 통통한 몸으로 열매를 쪼아 씨앗만 골라 먹어요. 썩은 나무에 굴을 파서 둥지를 만들어요." },
  { g:"Nestor", n:"케아·카카",
    diet:"뿌리, 열매, 꽃꿀, 나무 속 애벌레 등 거의 무엇이든 먹어요.", smart:"지능이 매우 높아 도구를 쓰고 퍼즐을 풀어요. 케아는 눈 덮인 산에 사는 앵무로, 호기심이 강해 자동차 부품을 뜯기도 해요." },
  { g:"Strigops", n:"카카포",
    diet:"풀, 씨앗, 열매, 특히 리무 나무 열매.", smart:"날지 못하고 밤에 활동하는, 세계에서 가장 무거운 앵무새예요. 한 마리 한 마리 이름을 붙여 보호하고 있어요." },
  { g:"Psittrichas", n:"독수리앵무",
    diet:"무화과 같은 부드러운 열매에 거의 의존해요.", smart:"얼굴에 깃털이 거의 없어 독수리를 닮았어요. 열매즙에 깃털이 엉기지 않게 진화한 것으로 여겨져요." },
  { g:"Lophopsittacus Mascarinus Necropsittacus", n:"마스카렌 제도의 앵무",
    diet:"기록이 거의 남아 있지 않아요 (씨앗과 열매로 추정).", smart:"사람이 섬에 들어온 뒤 사라져 그림과 뼈, 옛 기록으로만 전해져요." }
];
const GMAP = {}; GROUPS.forEach(G => G.g.split(" ").forEach(k => GMAP[k] = G));
const GEN = { n:"앵무새", diet:"씨앗, 열매, 꽃.", smart:"앵무새는 새 가운데 지능이 높은 편이에요. 무리나 짝과 어울려 지내요." };
const groupOf = sp => GMAP[sp.sci.split(" ")[0]] || GEN;
// 데이터에서 눈에 띄는 특징을 골라 짧은 말로
function featureChips(sp, A){
  const cn = c => (COLORS[c] && COLORS[c].ko) || c, dot = c => hex(c) ? `<i style="background:${hex(c)}"></i>` : "";
  const out = [];
  if (Array.isArray(A.main)) out.push(`${dot(A.main[0])}몸 ${cn(A.main[0])}`);
  [["crown","정수리"],["forehead","이마"],["face","얼굴"],["throat","목"],["breast","가슴"],["belly","배"],["wing","날개"],["tail","꼬리"]]
    .filter(([k]) => Array.isArray(A[k]) && Array.isArray(A.main) && A[k][0] !== A.main[0]).slice(0, 3)
    .forEach(([k, n]) => out.push(`${dot(A[k][0])}${n} ${cn(A[k][0])}`));
  if (A.crest) out.push("머리에 볏");
  if (Array.isArray(A.cheek)) out.push(`${dot(A.cheek[0])}뺨에 ${cn(A.cheek[0])} 점`);
  if (Array.isArray(A.collar)) out.push(`${dot(A.collar[0])}목에 ${cn(A.collar[0])} 띠`);
  if (A.eyeSkin === "face") out.push("얼굴에 넓은 맨살"); else if (A.eyeSkin === "ring") out.push("눈 둘레 맨살");
  if (A.pattern === "barred") out.push("가로 줄무늬"); else if (A.pattern === "scaled") out.push("비늘 무늬");
  if (A.tailShape === "long") out.push("긴 꼬리"); else if (A.tailShape === "short") out.push("짧은 꼬리");
  if (sp.looks.length > 1) out.push(`모습 ${sp.looks.length}가지`);
  return out.slice(0, 8);
}
function openDetail(si, from, found){
  if (!found) S.foundAt = null;
  const sp = SP[si], A = lookAttrs(sp, 0), G = groupOf(sp), u = photo(sp, "large"), sim = similar(si)[0];
  let m = document.getElementById("modal");
  if (!m) { m = document.createElement("div"); m.id = "modal"; m.className = "modal"; document.body.appendChild(m); }
  const simTxt = sim ? `<p>헷갈리기 쉬운 새 <button class="sim" data-sp="${sim.j}">${esc(nameOf(SP[sim.j]))}</button>${sim.diffs.length ? ` — ${sim.diffs.slice(0, 1).map(d => `${SHORT[d.q.id]}: 이 새는 ${vtext(d.q, d.va)}, 저 새는 ${vtext(d.q, d.vb)}`).join("")}` : " — 거의 같아요"}</p>` : "";
  const sparrow = (sp.sizeCm / 14);
  m.innerHTML = `<div class="mback" data-close></div>
    <article class="sheet" role="dialog" aria-modal="true" aria-label="${esc(nameOf(sp))}">
      <button class="mclose" data-close aria-label="닫기">×</button>
      <figure class="mph">${u ? `<img src="${esc(u)}" alt="${esc(nameOf(sp))}">` : `<div class="art">${birdSVG(A)}</div>`}${sp.photo && sp.photo.credit ? `<figcaption>사진 ${esc(sp.photo.credit)}</figcaption>` : ""}</figure>
      <div class="mbody">
        <div class="mhead">
          ${S.foundAt != null ? `<p class="ask">질문 ${S.foundAt}개 만에 찾았어요</p>` : ""}
          <h2>${esc(nameOf(sp))}</h2>
          ${starBtn(sp)}
          <p class="aka">${sp.extinct ? `<span class="badge red">멸종</span>` : ""}${esc(sp.en)}<br><span class="sci">${esc(sp.sci)}</span><br><span style="font-size:12px">${esc(G.n)} 무리</span></p>
          <div class="mlinks">${sp.wikipedia_url ? `<a class="link" href="${esc(sp.wikipedia_url)}" target="_blank" rel="noopener">위키백과 ↗</a>` : ""}<a class="link" href="https://www.inaturalist.org/search?q=${encodeURIComponent(sp.sci)}" target="_blank" rel="noopener">관찰 기록 ↗</a></div>
        </div>
        <div class="tiles">
          <section class="tile"><h3>사는 곳</h3><p>${esc(sp.region || "—")}</p></section>
          <section class="tile"><h3>몸길이</h3><p class="num">약 ${sp.sizeCm}cm<small>참새의 ${sparrow < 1.15 ? "비슷한 크기" : `약 ${sparrow.toFixed(1)}배`}</small></p></section>
          <section class="tile wide${sp.extinct ? " ext" : ""}"><h3>개체 수 · 보전 상태</h3>${sp.extinct ? `<p class="num">멸종</p><p>더 이상 살아 있는 개체가 없어요.</p>` : `<p>야생 개체 수와 위기 등급은 IUCN 적색목록에서 확인할 수 있어요.</p><p><a class="link" href="https://www.iucnredlist.org/search?query=${encodeURIComponent(sp.sci)}" target="_blank" rel="noopener">적색목록에서 보기 ↗</a></p>`}</section>
          <section class="tile wide"><h3>먹이</h3><p>${esc(G.diet)}</p></section>
          <section class="tile wide"><h3>지능 · 특기</h3><p>${esc(G.smart)}</p></section>
          <section class="tile wide"><h3>구별 포인트</h3><div class="chips">${featureChips(sp, A).map(t => `<span>${t}</span>`).join("")}</div>${simTxt}</section>
          <p class="mnote">먹이와 지능·특기는 같은 무리(속)의 공통 특징이에요.</p>
        </div>
      </div>
    </article>`;
  document.body.style.overflow = "hidden";
  requestAnimationFrame(() => requestAnimationFrame(() => m.classList.add("open")));
  bindStars(m);
  m.querySelectorAll("[data-close]").forEach(b => b.onclick = closeDetail);
  m.querySelectorAll("[data-sp]").forEach(b => b.onclick = () => openDetail(+b.dataset.sp, from));
  setTimeout(() => { const c = m.querySelector(".mclose"); c && c.focus({ preventScroll:true }); }, 50);
}
function closeDetail(){
  const m = document.getElementById("modal"); if (!m || !m.classList.contains("open")) return;
  m.classList.remove("open"); document.body.style.overflow = "";
  if (S.view === "browse" && document.getElementById("bgrid")) fillBrowse();   // 별을 바꿨으면 목록 순서·리본 갱신
  setTimeout(() => { if (!m.classList.contains("open")) m.innerHTML = ""; }, 400);
}
addEventListener("keydown", e => { if (e.key === "Escape") closeDetail(); });

/* ───────── 이동 ───────── */
function nav(v){ S.view = v; render(); scrollTo(0, 0); }
function render(){
  document.body.classList.toggle("on-cover", S.view === "cover");
  if (S.view === "cover") renderCover(); else if (S.view === "find") renderFind(); else if (S.view === "browse") renderBrowse(); else renderDetail();
}
document.getElementById("home").onclick = () => nav("cover");
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.view === "detail") document.getElementById("back").click(); });
let rt = 0; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (S.view === "find" || S.view === "cover") render(); }, 250); });

/* ───────── 눈동자가 마우스를 따라다닌다 ───────── */
(function eyeTrack(){
  const EX = 241, EY = 84, MAXR = 6;
  let tx = innerWidth / 2, ty = innerHeight / 2;
  const cur = new WeakMap();
  addEventListener("pointermove", e => { tx = e.clientX; ty = e.clientY; }, { passive:true });
  function tick(){
    document.querySelectorAll(".eyelive").forEach(g => {
      const ctm = g.parentNode && g.parentNode.getScreenCTM && g.parentNode.getScreenCTM(), svg = g.ownerSVGElement;
      if (!ctm) return;
      const pt = svg.createSVGPoint(); pt.x = tx; pt.y = ty;
      const loc = pt.matrixTransform(ctm.inverse());
      let dx = loc.x - EX, dy = loc.y - EY;
      const d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 180), mr = +(g.dataset.r || MAXR);
      dx = dx / d * mr * k; dy = dy / d * mr * k;
      const prev = cur.get(g) || { x:0, y:0 };
      const nx = prev.x + (dx - prev.x) * .25, ny = prev.y + (dy - prev.y) * .25;
      cur.set(g, { x:nx, y:ny });
      g.style.transform = `translate(${nx}px,${ny}px)`;
    });
    requestAnimationFrame(tick);
  }
  tick();
})();

render();
})();
</script>
